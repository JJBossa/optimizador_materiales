<div class="optimization-name-field mb-4">
  <label for="{{ field.id_for_label }}">Nombre del trabajo <span class="text-annotation">(opcional)</span></label>
  {{ field }}
  <small id="{{ field.auto_id }}_helptext" class="form-text text-muted">{{ field.help_text }} Puedes cambiarlo después sin modificar el plan de corte.</small>
  {% if field.errors %}<div class="text-danger" role="alert">{{ field.errors }}</div>{% endif %}
</div>
