<div class="mb-3" data-cliente-telefono>
  <div class="row g-2">
    <div class="col-md-6" data-selector-pais="telefono">
      {{ form.telefono_pais.as_field_group }}
    </div>
    <div class="col-md-6">
      <label for="{{ form.telefono.id_for_label }}" class="form-label">{{ form.telefono.label }}</label>
      {{ form.telefono }}
      {% if form.telefono.errors %}<div class="text-danger small">{{ form.telefono.errors }}</div>{% endif %}
      <small class="form-text text-muted" id="{{ form.telefono.auto_id }}_helptext">{{ form.telefono.help_text }}</small>
    </div>
  </div>
</div>
