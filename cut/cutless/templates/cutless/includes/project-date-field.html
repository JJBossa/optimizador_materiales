<div class="col-md-6">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}
    <div class="text-danger small" role="alert">
      {{ field.errors }}
      {% for error in field.errors.as_data %}
        {% if error.code == 'invalid' and field.value %}<p class="mb-0">Valor recibido «{{ field.value }}».</p>{% endif %}
      {% endfor %}
    </div>
  {% endif %}
  <small class="form-text text-muted" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>
</div>
